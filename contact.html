    <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>

    <!-- Heading -->
     <h1 class="m-10"> Contact us </h1>

    <!-- FORM -->
     <div class="container align-middle mt-10">
   <div class="row mb-5">
  <div class="col p-5">
    <input type="text" class="form-control" placeholder="First name" aria-label="First name">
  </div>
  <div class="col p-5">
    <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
  </div>
  </div>

  <div class="form-field p-5">
  <label for="fieldText" class="form-label">Email address</label>
  <input type="email" class="form-control" id="fieldText" placeholder="name@example.com">
  <div class="form-text">
    We’ll never share your email with anyone else.
  </div>
  </div>

  <div class="form-field p-5">
  <label for="fieldSelect" class="form-label">Message topic</label>
  <select class="form-control" id="fieldSelect">
    <option selected>Choose one…</option>
    <option value="1">Question</option>
    <option value="2">Comment</option>
    <option value="3">Help</option>
  </select>
  </div>

<div class="form-field p-5">
  <label for="exampleFormControlTextarea2" class="form-label">Write your message here</label>
  <textarea class="form-control" id="exampleFormControlTextarea2" rows="4"></textarea>
</div>

  <div class="form-field p-5">
  <input type="checkbox" id="checkLabel" class="check" />
  <label for="checkLabel">I agree to send</label>
  </div>

  <div class="col-12 p-8">
    <button type="submit" class="btn-solid theme-primary">Submit</button>
  </div>
</form>

  </div>

   
  



    <footer class="Foot text-center mb-5"> © City of Mississauga 2019 - 2026 </footer>
